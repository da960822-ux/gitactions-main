# ---------------------------------------------------------------
# DEV (개발용) 실행용 Compose
#  - 소스 코드를 컨테이너에 bind mount → 저장 즉시 반영 (Hot Reload)
#    - frontend : Vite dev 서버
#    - backend  : Gradle bootRun
#    - model    : uvicorn --reload
#  - 실습 시: docker compose -f docker-compose.dev.yml up --build
# ---------------------------------------------------------------
services:
  mysql:
    image: mysql:8.0
    container_name: mood-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mooddb}
      MYSQL_USER: ${MYSQL_USER:-mooduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moodpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mood-net-dev

  mood-model:
    build:
      context: ./model
      dockerfile: Dockerfile.dev
    container_name: mood-model-dev
    volumes:
      - ./model:/app          # 소스 변경 -> uvicorn --reload 가 감지
    networks:
      - mood-net-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mood-backend-dev
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-mooddb}
      DB_USER: ${MYSQL_USER:-mooduser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-moodpass}
      MODEL_BASE_URL: http://mood-model:8000
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app
      - backend-gradle-cache:/home/gradle/.gradle   # 매번 의존성 다시 받지 않도록 캐시
    depends_on:
      mysql:
        condition: service_healthy
      mood-model:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - mood-net-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mood-frontend-dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules       # 컨테이너 내부 node_modules를 그대로 사용 (호스트로 덮어쓰지 않도록)
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - mood-net-dev

networks:
  mood-net-dev:
    driver: bridge

volumes:
  mysql-data-dev:
  backend-gradle-cache:
